<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <!-- FontAwesome icons link for the search button -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="weather-app">
        <div class="container">
            <h3 class="brand">THE WEATHER</h3>
            <div>
                <h1 class="temp">--&#176</h1>
                <div class="city-time">
                    <h1 class="name">Loading...</h1>
                    <small>
                        <span class="time">00:00</span>
                        <span class="date">Loading Date...</span>
                    </small>
                </div>
                <div class="weather">
                    <img src="https://weatherapi.com" class="icon" alt="weather-icon" width="50" height="50" />
                    <span class="condition">--</span>
                </div>
            </div>
        </div>
        
        <div class="panel">
            <form id="locationInput">
                <input type="text" class="search" placeholder="Search Location..." />
                <button type="submit" class="submit">
                    <i class="fas fa-search"></i>
                </button>
            </form>
            <ul class="cities">
                <li class="city">New York</li>
                <li class="city">California</li>
                <li class="city">Paris</li>
                <li class="city">Tokyo</li>
            </ul>
            <ul class="details">
                <h4>WEATHER DETAILS</h4>
                <li>
                    <span>Condition</span>
                    <span class="condition-detail">--</span>
                </li>
                <li>
                    <span>Cloud Coverage</span>
                    <span class="cloud">--%</span>
                </li>
                <li>
                    <span>Humidity</span>
                    <span class="humidity">--%</span>
                </li>
                <li>
                    <span>Wind Speed</span>
                    <span class="wind">-- km/h</span>
                </li>
            </ul>
        </div>
    </div> 
    <script src="script2.js"></script>
</body>
</html>
